name: Python tests

on:
  push:
    paths:
      - 'portfolio/csv-cleaner/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'portfolio/csv-cleaner/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CSV cleaner tests
        run: python -m unittest discover -s portfolio/csv-cleaner/tests -v
